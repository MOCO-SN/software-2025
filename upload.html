<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload App – MocoStore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="header glass">
    <div class="container header-inner">
      <div class="logo">
        <img src="icon.jpg" alt="MocoStore" class="logo-icon" />
        <span class="logo-text">Moco<span>Store</span></span>
      </div>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
          <li><a href="upload.html" class="active"><i class="fas fa-cloud-upload-alt"></i> Upload</a></li>
          <li><a href="https://mocosn.in" target="_blank"><i class="fas fa-envelope"></i> Contact</a></li>
        </ul>
        <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="upload-container">
        <h2><i class="fas fa-cloud-upload-alt"></i> Upload Your App</h2>
        <p class="upload-subtitle">Share your Android app with the MocoStore community</p>

        <form id="uploadForm" class="upload-form">
          <div class="form-group">
            <label for="appName"><i class="fas fa-mobile-alt"></i> App Name *</label>
            <input type="text" id="appName" placeholder="Enter app name" required />
          </div>

          <div class="form-group">
            <label for="appDesc"><i class="fas fa-align-left"></i> Description *</label>
            <textarea id="appDesc" rows="3" placeholder="Brief description of your app" required></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="appIcon"><i class="fas fa-image"></i> Icon URL *</label>
              <input type="url" id="appIcon" placeholder="https://example.com/icon.png" required />
            </div>
            <div class="form-group">
              <label for="appApk"><i class="fas fa-file-archive"></i> APK URL *</label>
              <input type="url" id="appApk" placeholder="https://example.com/app.apk" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="appCategory"><i class="fas fa-tag"></i> Category</label>
              <select id="appCategory">
                <option value="">Select category</option>
                <option value="games">Games</option>
                <option value="social">Social</option>
                <option value="tools">Tools</option>
                <option value="entertainment">Entertainment</option>
                <option value="education">Education</option>
              </select>
            </div>
            <div class="form-group">
              <label for="appDeveloper"><i class="fas fa-user"></i> Developer</label>
              <input type="text" id="appDeveloper" placeholder="Developer name" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="appVersion"><i class="fas fa-code-branch"></i> Version</label>
              <input type="text" id="appVersion" placeholder="1.0.0" />
            </div>
            <div class="form-group">
              <label for="appSize"><i class="fas fa-weight-hanging"></i> Size</label>
              <input type="text" id="appSize" placeholder="e.g. 25 MB" />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-upload"></i> Upload App
            </button>
            <button type="reset" class="btn btn-secondary">
              <i class="fas fa-redo"></i> Reset
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer glass">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img src="icon.jpg" alt="MocoStore" class="footer-icon" />
        <span>MocoStore</span>
        <p>Discover the best Android apps. Download safely & fast.</p>
      </div>
      <div class="footer-credit">
        <p>Developed with ❤️ by <strong>Sachin Patel</strong></p>
        <p>EC(VLSI), Bihar Engineering University, Patna</p>
        <p>&copy; 2026 MocoStore. MIT License</p>
      </div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="index.js"></script>
  <script src="js/uploads.js"></script>
</body>
</html>
